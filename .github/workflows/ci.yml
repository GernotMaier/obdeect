---
name: CI-linter

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install linters
        run: python -m pip install --upgrade pip pre-commit ruff clang-format
      - name: Run repository hooks
        run: pre-commit run --all-files
      - name: Check Python formatting and lint
        run: ruff format --check python && ruff check python
      - name: Check C++ formatting
        run: >-
          find cpp -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0
          | xargs -0 clang-format --dry-run --Werror
