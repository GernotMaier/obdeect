name: Quality

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install linters
        run: python -m pip install --upgrade pip pre-commit ruff
      - name: Run repository hooks
        run: pre-commit run --all-files
      - name: Check Python formatting and lint
        run: ruff format --check python tools examples && ruff check python tools examples
