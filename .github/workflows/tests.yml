---
name: CI-tests

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install Python package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install . pytest
      - name: Configure and build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel
      - name: Run native and Python tests
        run: ctest --test-dir build --output-on-failure && pytest python/tests
      - name: Run and render examples
        run: python examples/run_examples.py --build build --output out/examples --photons 128
  build-and-test-eventio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: cta-observatory/pyhessio
          path: hessio
      - name: Build EventIO dependency
        run: |
          ln -sfn hessioxxx/include hessio/include
          cmake -S hessio -B hessio/build -DCMAKE_BUILD_TYPE=Release
          cmake --build hessio/build --target hessio --parallel
      - name: Configure and build EventIO reader
        run: >-
          cmake -S . -B build-eventio -DCMAKE_BUILD_TYPE=Release
          -DOBDEECT_BUILD_EVENTIO_INPUT=ON
          -DEventio_ROOT=${{ github.workspace }}/hessio
          -DEventio_LIBRARY=${{ github.workspace }}/hessio/build/lib/libhessio.so
          -DEventio_CORSIKA_INCLUDE_DIR=${{ github.workspace }}/hessio/include
          -DEventio_BASIC_INCLUDE_DIR=${{ github.workspace }}/hessio/include
          -DEventio_COMMON_INCLUDE_DIR=${{ github.workspace }}/hessio/include
          && cmake --build build-eventio --parallel
      - name: Run EventIO reader test
        run: >-
          LD_LIBRARY_PATH=${{ github.workspace }}/hessio/build/lib:${LD_LIBRARY_PATH}
          ctest --test-dir build-eventio --output-on-failure -R obdeect_eventio_input_tests
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Configure, build, and test with sanitizers
        run: >-
          cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          && cmake --build build-sanitize --parallel
          && ctest --test-dir build-sanitize --output-on-failure
