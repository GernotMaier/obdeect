---
name: CI-docs
# Publish dev and release documentation together, preserving root URLs.

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install obdeect with the documentation tools
        run: python -m pip install --upgrade pip && python -m pip install ".[docs]"
      - name: Test documentation publishing
        run: |
          python -m pip install pytest
          python -m pytest -q python/tests/test_docs_versions.py
      - name: Build versioned site
        env:
          DOCS_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          args=(--output docs/_build/site --base-url "$DOCS_BASE_URL")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            args+=(--dev-ref origin/main)
          fi
          python docs/build_versions.py "${args[@]}"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/site

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
