[build-system]
build-backend = "scikit_build_core.build"
requires = [ "nanobind>=3.1", "scikit-build-core>=0.10", "setuptools-scm>=8" ]

[project]
name = "obdeect-dev"
description = "Ray tracing for imaging atmospheric Cherenkov telescopes"
readme = "README.md"
license = { file = "LICENSE" }
authors = [ { name = "obdeect contributors" } ]
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=2.3",
]
optional-dependencies.dev = [ "pre-commit", "pytest", "ruff", "towncrier" ]
scripts.obdeect-analytic-optics = "obdeect.cli:analytic_optics_main"
scripts.obdeect-benchmark = "obdeect.benchmark:main"
scripts.obdeect-compile-optical-model = "obdeect.optical_model_compiler:main"
scripts.obdeect-demo-mst = "obdeect.cli:demo_mst_main"
scripts.obdeect-normalize-arrivals = "obdeect.arrival_normalizer:main"
scripts.obdeect-photon-distributions = "obdeect.photon_distributions:main"
scripts.obdeect-plot-reference = "obdeect.plotting:main"
scripts.obdeect-psf = "obdeect.analysis:main"
scripts.obdeect-reference-run = "obdeect.reference_run:main"
scripts.obdeect-simtools-raytrace = "obdeect.cli:simtools_raytrace_main"
scripts.obdeect-validate-production = "obdeect.production_validation:main"

[tool.setuptools_scm]
fallback_version = "0.1.0"

[tool.scikit-build]
cmake.args = [ "-DOBDEECT_BUILD_TESTING=OFF", "-DOBDEECT_BUILD_EVENTIO_INPUT=OFF" ]
cmake.build-type = "Release"
sdist.include = [ "cpp/**", "cmake/**", "CMakeLists.txt", "python/**", "README.md", "LICENSE", "tools/**" ]
wheel.packages = [ "python/obdeect" ]
wheel.platlib = true

[tool.cibuildwheel]
# libc++ floating-point to_chars is available from macOS 13.3.
macos.environment = { MACOSX_DEPLOYMENT_TARGET = "13.3" }

[tool.ruff]
target-version = "py314"
line-length = 100
preview = true
lint.select = [ "E", "F", "I", "UP" ]

[tool.towncrier]
package = "obdeect"
package_dir = "python"
directory = "docs/changes"
filename = "CHANGELOG.md"
title_format = "## [{version}] - {project_date}"
issue_format = "#{issue}"
underlines = [ "", "", "" ]
type = [
  { directory = "feature", name = "Added", showcontent = true },
  { directory = "bugfix", name = "Fixed", showcontent = true },
]

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"
