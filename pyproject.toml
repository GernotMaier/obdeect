[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=68" ]

[project]
name = "obdeect"
version = "0.1.0"
description = "Ray tracing for imaging atmospheric Cherenkov telescopes"
readme = "README.md"
license = { file = "LICENSE" }
authors = [ { name = "obdeect contributors" } ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "matplotlib>=3.8",
]
optional-dependencies.dev = [ "pre-commit", "pytest", "ruff", "towncrier" ]
scripts.obdeect-compile-scene = "obdeect.scene_compiler:main"
scripts.obdeect-import-simulation-models = "obdeect.model_import:main"
scripts.obdeect-plot-toy = "obdeect.plotting:main"
scripts.obdeect-psf = "obdeect.analysis:main"
scripts.obdeect-reference-manifest = "obdeect.reference_manifest:main"

[tool.setuptools]
packages.find.where = [ "python" ]
package-dir = { "" = "python" }

[tool.ruff]
target-version = "py314"
line-length = 100
preview = true
lint.select = [ "E", "F", "I", "UP" ]

[tool.towncrier]
package = "obdeect"
package_dir = "python"
directory = "docs/changes"
filename = "CHANGELOG.md"
title_format = "## [{version}] - {project_date}"
issue_format = "#{issue}"
underlines = [ "", "", "" ]
type = [
  { directory = "feature", name = "Added", showcontent = true },
  { directory = "bugfix", name = "Fixed", showcontent = true },
]
