[build-system]
build-backend = "scikit_build_core.build"
requires = [ "scikit-build-core>=0.10", "setuptools-scm>=8" ]

[project]
name = "obdeect-dev"
description = "Ray tracing for imaging atmospheric Cherenkov telescopes"
readme = "README.md"
license = { file = "LICENSE" }
authors = [ { name = "obdeect contributors" } ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
dependencies = [
  "matplotlib>=3.8",
]
optional-dependencies.dev = [ "pre-commit", "pytest", "ruff", "towncrier" ]
scripts.obdeect-compile-scene = "obdeect.scene_compiler:main"
scripts.obdeect-ctao = "obdeect.cli:ctao_main"
scripts.obdeect-import-simulation-models = "obdeect.model_import:main"
scripts.obdeect-plot-reference = "obdeect.plotting:main"
scripts.obdeect-psf = "obdeect.analysis:main"
scripts.obdeect-reference = "obdeect.cli:reference_main"
scripts.obdeect-reference-manifest = "obdeect.reference_manifest:main"
scripts.obdeect-simtools-raytrace = "obdeect.cli:simtools_raytrace_main"

[tool.setuptools_scm]
fallback_version = "0.1.0"

[tool.scikit-build]
cmake.args = [ "-DOBDEECT_BUILD_TESTING=OFF", "-DOBDEECT_BUILD_EVENTIO_INPUT=OFF" ]
cmake.build-type = "Release"
sdist.include = [ "cpp/**", "cmake/**", "CMakeLists.txt", "python/**", "README.md", "LICENSE" ]
wheel.packages = [ "python/obdeect" ]
wheel.platlib = true
wheel.py-api = "py3"

[tool.ruff]
target-version = "py314"
line-length = 100
preview = true
lint.select = [ "E", "F", "I", "UP" ]

[tool.towncrier]
package = "obdeect"
package_dir = "python"
directory = "docs/changes"
filename = "CHANGELOG.md"
title_format = "## [{version}] - {project_date}"
issue_format = "#{issue}"
underlines = [ "", "", "" ]
type = [
  { directory = "feature", name = "Added", showcontent = true },
  { directory = "bugfix", name = "Fixed", showcontent = true },
]

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"
