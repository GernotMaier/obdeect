[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obdeect"
version = "0.1.0"
description = "Ray tracing for imaging atmospheric Cherenkov telescopes"
readme = "README.md"
requires-python = ">=3.14"
license = {file = "LICENSE"}
authors = [{name = "obdeect contributors"}]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "matplotlib",
  "cmake",
  "ninja",
]

[project.optional-dependencies]
dev = ["pre-commit", "pytest", "ruff", "towncrier"]

[project.scripts]
obdeect-plot-toy = "obdeect.plotting:main"
obdeect-import-simulation-models = "obdeect.model_import:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.towncrier]
directory = "changes"
filename = "CHANGELOG.md"
package = "obdeect"
underlines = ["", "", ""]
title_format = "## [{version}] - {project_date}"
issue_format = "#{issue}"

[[tool.towncrier.type]]
directory = "feature"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Fixed"
showcontent = true
