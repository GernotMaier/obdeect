[build-system]
build-backend = "scikit_build_core.build"
requires = [ "nanobind>=3.1", "scikit-build-core>=0.10", "setuptools-scm>=8" ]

[project]
name = "obdeect-dev"
description = "Ray tracing for imaging atmospheric Cherenkov telescopes"
readme = "README.md"
license = { file = "LICENSE" }
authors = [ { name = "obdeect contributors" } ]
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=2.3",
]
optional-dependencies.dev = [ "nanobind>=3.1", "pre-commit", "pytest", "ruff", "scipy" ]
optional-dependencies.docs = [ "astropy", "myst-parser", "pydata-sphinx-theme", "pyyaml", "sphinx" ]
scripts.obdeect = "obdeect.cli:main"

[tool.setuptools_scm]
fallback_version = "0.1.0"

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
cmake.args = [ "-DOBDEECT_BUILD_TESTING=OFF" ]
cmake.build-type = "Release"
sdist.include = [ "cpp/**", "CMakeLists.txt", "python/**", "README.md", "LICENSE" ]
wheel.packages = [ "python/obdeect" ]
wheel.platlib = true
# Editable installs rebuild the extension when the C++ sources change.
editable.rebuild = true
editable.verbose = false

[tool.cibuildwheel]
# Oldest macOS release supported by the binary wheels.
macos.environment = { MACOSX_DEPLOYMENT_TARGET = "13.3" }

[tool.ruff]
target-version = "py314"
line-length = 100
preview = true
lint.select = [ "E", "F", "I", "UP" ]

[tool.towncrier]
package = "obdeect"
package_dir = "python"
directory = "docs/changes"
filename = "CHANGELOG.md"
title_format = "## [{version}] - {project_date}"
issue_format = "#{issue}"
underlines = [ "", "", "" ]
type = [
  { directory = "feature", name = "Added", showcontent = true },
  { directory = "bugfix", name = "Fixed", showcontent = true },
]

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"
